baseURL: https://chegini.github.io/
theme: hugobricks
defaultContentLanguage: en
assetDir: static
outputs:
  home: [html, rss, json]
  taxonomy: []
  term: []
markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      extras:
        insert: {enable: true}
        mark: {enable: true}
        subscript: {enable: true}
        superscript: {enable: true}
languages:
  en:
    label: English
    contentDir: content/en
    weight: 1
    disabled: false
    params:
      flag:
    permalinks:
      page:
        posts: /blog/:slug
      section:
        posts: /blog/
